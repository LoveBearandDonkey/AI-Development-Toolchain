  <dialog class="msm-dialog" id="device-dialog" aria-labelledby="device-dialog-title">
    <form id="device-form">
      <header class="dialog-heading"><div><h2 id="device-dialog-title">确认上机范围</h2><p>审批后进入示例实测流程。</p></div><button type="button" class="icon-button" data-close-dialog="device-dialog" aria-label="关闭"><span class="codicon codicon-close"></span></button></header>
      <div id="device-dialog-context" class="dialog-context"></div>
      <div class="form-grid">
        <label>最多运行次数<input id="device-trials" type="number" min="3" max="12" required value="3"></label>
        <label>时间预算（分钟）<input id="device-minutes" type="number" min="5" max="180" required value="30"></label>
      </div>
      <p class="scope-note"><span class="codicon codicon-beaker" aria-hidden="true"></span>包含基线、一次参数试验和独立复测。演示用构造数据表现每个阶段。</p>
      <footer class="dialog-actions"><button type="button" class="secondary" data-close-dialog="device-dialog">只查看仿真</button><button class="primary" type="submit">确认并查看实测流程</button></footer>
    </form>
  </dialog>

  <dialog class="msm-dialog" id="file-dialog" aria-labelledby="file-title">
    <div class="dialog-heading"><div><h2 id="file-title"></h2><p>场景工作区里的示例文件</p></div><button type="button" class="icon-button" data-close-dialog="file-dialog" aria-label="关闭"><span class="codicon codicon-close"></span></button></div>
    <pre id="file-content"></pre>
  </dialog>

</body>
</html>
