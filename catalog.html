<script>
const categories = [
  { id: "all", label: "全部", icon: "icon-layout-grid" },
  { id: "Agent与协作", label: "Agent与协作", icon: "icon-users-round" },
  { id: "决策与诊断", label: "决策与诊断", icon: "icon-activity" },
  { id: "采集与执行", label: "采集与执行", icon: "icon-toolbox" },
  { id: "底层与运行生态", label: "底层与运行生态", icon: "icon-cpu" }
];

const launchItems = [
  {
    "title": "智能计算助手",
    "group": "Agent与协作",
    "status": "hi-fi",
    "desc": "计算领域知识百科，工具百事通。兼顾GUI和TUI",
    "href": "https://lovebearanddonkey.github.io/InsightChat/demo/",
    "preview": "assets/agent.png",
    "tags": [
      "msAgent"
    ]
  },
  {
    "title": "硬件画像",
    "group": "决策与诊断",
    "status": "hi-fi",
    "desc": "推理性能仿真的硬件画像建模",
    "href": "https://lovebearanddonkey.github.io/AI-Development-Toolchain/msModeling/%E7%A1%AC%E4%BB%B6%E7%94%BB%E5%83%8F.html",
    "preview": "assets/modeling.png",
    "tags": [
      "MS Modeling"
    ]
  },
  {
    "title": "性能分析2.0",
    "group": "Agent与协作",
    "status": "hi-fi",
    "desc": "模型训/推性能分析，Agent辅助性能调优",
    "href": "https://lovebearanddonkey.github.io/InsightChat/app/pages/chat.html",
    "preview": "assets/insight.png",
    "tags": [
      "MS Insight"
    ]
  },
  {
    "title": "采集指令沙箱",
    "group": "采集与执行",
    "status": "hi-fi",
    "desc": "表单式、命令式采集指令编排与效果预估",
    "href": "https://lovebearanddonkey.github.io/AI-Development-Toolchain/msProf/性能采集实验台.html",
    "preview": "assets/prof.png",
    "tags": [
      "MS Profiler"
    ]
  },
  {
    "title": "训练配置校验",
    "group": "底层与运行生态",
    "status": "hi-fi",
    "desc": "模型结构与并行配置可视化，训练配置兼容性校验，配置寻优",
    "href": "https://lovebearanddonkey.github.io/InsightChat/demo/",
    "preview": "assets/speed.png",
    "tags": [
      "MindSpeed"
    ]
  },
  {
    "title": "重计算与Swap提升性能",
    "group": "底层与运行生态",
    "status": "doc",
    "desc": "重计算与Swap的细粒度控制对内存和性能影响",
    "href": "https://lovebearanddonkey.github.io/AI-Development-Toolchain/FSDP%20Turbo/%E9%87%8D%E8%AE%A1%E7%AE%97%E4%B8%8ESwap-%E6%BF%80%E6%B4%BB%E7%94%9F%E5%91%BD%E5%91%A8%E6%9C%9F.html",
    "preview": "assets/fsdp.png",
    "tags": [
      "FSDP Turbo"
    ]
  }
];

const visibleLaunchItems = launchItems.filter((item) => !item.hidden);

const STATUS_META = {
  "hi-fi": { label: "可体验", cls: "is-live" },
  "lo-fi": { label: "原型", cls: "is-proto" },
  "doc": { label: "文档", cls: "is-doc" }
};

const state = {
  category: "all",
  query: "",
  status: "all",
  sort: "default"
};

const categoryList = document.getElementById("categoryList");
const grid = document.getElementById("grid");
const emptyState = document.getElementById("emptyState");
const activeTitle = document.getElementById("activeTitle");

const globalSearch = document.getElementById("globalSearch");

function itemTargetAttrs(href) {
  const isExternal = /^https?:\/\//.test(href);
  return isExternal ? ' target="_blank" rel="noreferrer"' : "";
}

function normalize(value) {
  return String(value || "").trim().toLowerCase();
}

function renderCategories(animate = false) {
  const counts = visibleLaunchItems.reduce((acc, item) => {
    acc[item.group] = (acc[item.group] || 0) + 1;
    return acc;
  }, {});

  categoryList.innerHTML = categories.map((category) => {
    const count = category.id === "all" ? visibleLaunchItems.length : (counts[category.id] || 0);
    const active = state.category === category.id ? " is-active" : "";
    return `
      <button class="side-item${active}" type="button" data-category="${category.id}" aria-pressed="${state.category === category.id}">
        <span class="side-label">${category.label}</span>
        <span class="side-count">${count}</span>
      </button>
    `;
  }).join("");
  if (animate && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
    categoryList.querySelectorAll('.side-item').forEach((item, index) => {
      item.animate([
        { opacity: 0, scale: '0.6', translate: '0 16px' },
        { opacity: 1, scale: '1', translate: '0 0' }
      ], {
        duration: 550,
        delay: index * 80,
        easing: 'cubic-bezier(.34, 1.56, .64, 1)',
        fill: 'backwards'
      });
    });
  }
}

function getFilteredItems() {
  const query = normalize(state.query);
  let items = visibleLaunchItems.filter((item) => {
    const inCategory = state.category === "all" || item.group === state.category;
    const inStatus = state.status === "all" || item.status === state.status;
    const haystack = normalize([
      item.title,
      item.sub,
      item.group,
      item.status,
      (STATUS_META[item.status] || {}).label,
      item.desc,
      item.href,
      ...(item.tags || [])
    ].join(" "));
    return inCategory && inStatus && (!query || haystack.includes(query));
  });

  if (state.sort === "title") {
    items = [...items].sort((a, b) => a.title.localeCompare(b.title, "zh-CN"));
  } else if (state.sort === "group") {
    items = [...items].sort((a, b) => {
      const groupResult = a.group.localeCompare(b.group, "zh-CN");
      return groupResult || a.title.localeCompare(b.title, "zh-CN");
    });
  }

  return items;
}

function renderPreview(item) {
  if (item.blankPreview) return "";
  if (item.previewFrame) {
    const interactiveClass = item.interactivePreview ? " class=\"is-interactive\"" : "";
    return `<iframe${interactiveClass} src="${item.previewFrame}" title="${item.title} 预览" loading="lazy"></iframe>`;
  }

  if (item.preview) {
    const fitClass = item.fit === "contain" ? " class=\"is-contain\"" : "";
    if (item.previewDark) {
      return `
        <div class="preview-duo">
          <img${fitClass} src="${item.preview}" alt="${item.title} 浅色静态预览" loading="lazy" decoding="async">
          <img${fitClass} src="${item.previewDark}" alt="${item.title} 深色静态预览" loading="lazy" decoding="async">
        </div>
      `;
    }
    return `<img${fitClass} src="${item.preview}" alt="${item.title} 静态预览" loading="lazy" decoding="async">`;
  }

  return `<div class="preview-placeholder">${item.group}</div>`;
}

function renderCard(item) {
  const hasLink = Boolean(item.href);
  const cardTag = hasLink ? "a" : "article";
  const cardAttrs = hasLink ? ` href="${item.href}"${itemTargetAttrs(item.href)} aria-label="${item.title}"` : "";
  const hasPreview = !item.blankPreview && Boolean(item.preview || item.previewFrame);

  const tagHtml = (item.tags || []).slice(0, 3).map((tag) => `<span class="tag-chip">${tag}</span>`).join("");
  const status = STATUS_META[item.status] || { label: item.status, cls: "" };

  return `
    <${cardTag} class="card-demo launch-card" data-group="${item.group}" data-status="${item.status}"${cardAttrs}>
      ${hasPreview ? `<div class="card-preview">
        ${renderPreview(item)}
      </div>` : ""}
      <div class="card-demo-header">
        <div class="card-title-row">
          <h3 class="card-demo-title">${item.title}</h3>
          <span class="status-pill${status.cls ? " " + status.cls : ""}">${status.label}</span>
        </div>
        ${item.sub ? `<div class="card-demo-sub">${item.sub}</div>` : ""}
        <div class="card-demo-description">${item.desc}</div>
        <div class="tag-row">${tagHtml}</div>
      </div>
    </${cardTag}>
  `;
}

function renderGrid() {
  const items = getFilteredItems();
  const activeCategory = categories.find((category) => category.id === state.category);
  activeTitle.textContent = state.category === "all" ? "全部项目" : activeCategory.label;
  grid.innerHTML = items.map(renderCard).join("");
  emptyState.classList.toggle("is-visible", items.length === 0);
}

function syncSearch(value) {
  state.query = value;
  if (globalSearch.value !== value) globalSearch.value = value;
  renderGrid();
}

categoryList.addEventListener("click", (event) => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  categoryList.querySelectorAll('.side-item').forEach((item) => {
    const active = item === button;
    item.classList.toggle('is-active', active);
    item.setAttribute('aria-pressed', String(active));
  });
  renderGrid();
});

globalSearch.addEventListener("input", (event) => syncSearch(event.target.value));

const resetFilters = document.getElementById("resetFilters");
resetFilters.addEventListener("click", () => {
  state.category = "all";
  state.query = "";
  globalSearch.value = "";
  renderCategories();
  renderGrid();
});

window.addEventListener("keydown", (event) => {
  if (event.ctrlKey || event.metaKey || event.altKey || event.repeat) return;
  const isTyping = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName) || document.activeElement.isContentEditable;
  if (event.key === "/" && !isTyping) {
    event.preventDefault();
    globalSearch.focus();
  }
});

renderCategories(true);
renderGrid();
</script>
</body>
