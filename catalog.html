<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 开发工具链 · 陈列馆</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffffff'/%3E%3Cpath d='M17 40V24h8c4 0 7 3 7 8s-3 8-7 8h-8Zm20 0V24h10v4h-6v3h5v4h-5v5h-4Z' fill='%230f172a'/%3E%3Cpath d='M14 18h20l-5 7H14z' fill='%23e5484d'/%3E%3C/svg%3E">
<link rel="stylesheet" href="vendor/pto-design-system/tokens/foundation.css">
<link rel="stylesheet" href="vendor/pto-design-system/tokens/semantic.css">
<link rel="stylesheet" href="vendor/pto-design-system/tokens/components.css">
<link rel="stylesheet" href="vendor/pto-design-system/css/style.css">
<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

html {
  height: auto;
  overflow-x: hidden;
  overflow-y: auto;
  scrollbar-color: color-mix(in srgb, var(--foreground-muted) 52%, transparent) transparent;
  scrollbar-width: thin;
}

body {
  min-width: 320px;
  height: auto;
  min-height: 100vh;
  overflow-x: hidden;
  overflow-y: auto;
  display: block;
  position: relative;
  isolation: isolate;
  background: #ffffff;
  background-attachment: fixed;
  color: var(--foreground);
  font-family: var(--font-sans);
}
* {
  scrollbar-color: color-mix(in srgb, var(--foreground-muted) 52%, transparent) transparent;
  scrollbar-width: thin;
}
*::-webkit-scrollbar {
  width: 10px;
  height: 10px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  min-height: 32px;
  border: 2px solid transparent;
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--foreground-muted) 56%, transparent);
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover {
  background: color-mix(in srgb, var(--foreground-secondary) 62%, transparent);
  background-clip: content-box;
}
*::-webkit-scrollbar-corner {
  background: transparent;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background: url("assets/bg.png") left top / auto 100vh no-repeat;
  opacity: 0.15;
  transform: scaleX(-1);
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 12% 6%, rgba(247, 183, 219, 0.41) 0, rgba(247, 183, 219, 0) 34%),
    radial-gradient(circle at 88% 8%, rgba(247, 191, 132, 0.34) 0, rgba(247, 191, 132, 0) 30%),
    radial-gradient(circle at 46% 0%, rgba(189, 169, 232, 0.32) 0, rgba(189, 169, 232, 0) 34%),
    linear-gradient(180deg, #f8efff 0%, #eef4ff 47%, #e9eef8 100%);
  opacity: 0.2;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select {
  font: inherit;
}

.svg-icon {
  width: 18px;
  height: 18px;
  display: inline-block;
  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.cann-app {
  position: relative;
  z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.cann-topbar {
  position: sticky;
  top: 0;
  z-index: var(--z-modal);
  background: rgba(255, 255, 255, 0.5);
  border-bottom: 1px solid var(--border-subtle);
  backdrop-filter: blur(16px);
}

.cann-primary {
  width: 100%;
  max-width: 1680px;
  margin: 0 auto;
  height: 62px;
  padding: 0 32px;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(320px, 520px);
  align-items: center;
  gap: var(--space-6);
  overflow: hidden;
  transition:
    height var(--duration-base) var(--easing-default),
    padding var(--duration-base) var(--easing-default),
    opacity var(--duration-fast) var(--easing-default),
    transform var(--duration-base) var(--easing-default);
}

.cann-topbar.is-collapsed .cann-primary {
  height: 0;
  min-height: 0;
  padding-top: 0;
  padding-bottom: 0;
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px);
}

.cann-brand,
.cann-actions,
.cann-nav {
  display: flex;
  align-items: center;
}

.cann-brand {
  min-width: 0;
  gap: var(--space-3);
}

.cann-actions {
  justify-content: flex-end;
  gap: var(--space-3);
  min-width: 0;
}

.cann-menu {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--radius-md);
  color: var(--foreground-secondary);
  background: transparent;
  cursor: pointer;
}

.cann-logo {
  width: 84px;
  height: 32px;
  flex: 0 0 auto;
  display: none;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.cann-logo img {
  width: 84px;
  height: 32px;
  display: block;
}

.cann-name {
  color: var(--foreground);
  font-size: 19px;
  font-weight: 700;
  line-height: 1;
  white-space: nowrap;
}

.global-search {
  min-width: 0;
  height: 38px;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-pill);
  background: color-mix(in srgb, var(--surface-1) 88%, var(--background));
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding: 0 16px;
  color: var(--foreground-muted);
}

.search-icon {
  width: 17px;
  height: 17px;
}

.global-search input {
  min-width: 0;
  width: 100%;
  border: 0;
  outline: 0;
  background: transparent;
  color: var(--foreground);
}

.global-search input::placeholder {
  color: var(--foreground-muted);
}

.create-btn {
  min-width: 130px;
  border-radius: var(--radius-pill);
}

.bell-btn,
.avatar-btn {
  position: relative;
  width: 36px;
  height: 36px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--foreground-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

.notify-count {
  position: absolute;
  top: 2px;
  right: -1px;
  min-width: 22px;
  height: 18px;
  padding: 0 5px;
  border-radius: var(--radius-pill);
  background: var(--danger);
  color: var(--primary-foreground);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
}

.avatar-btn {
  background:
    radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--warning) 28%, white) 0 32%, transparent 34%),
    color-mix(in srgb, var(--warning) 18%, var(--surface-1));
  color: color-mix(in srgb, var(--warning) 70%, var(--foreground));
}

.cann-nav-wrap {
  height: 58px;
  padding: 0 132px;
  display: flex;
  align-items: center;
}

.cann-nav {
  height: 100%;
  gap: 28px;
}

.cann-nav-link {
  height: 100%;
  display: inline-flex;
  align-items: center;
  gap: 9px;
  position: relative;
  color: var(--foreground-secondary);
  font-size: 15px;
  font-weight: 700;
  white-space: nowrap;
}

.cann-nav-link.is-active {
  color: var(--foreground);
}

.cann-nav-link.is-active::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 3px;
  border-radius: 0;
  background: var(--foreground);
}

.nav-icon {
  color: var(--foreground-disabled);
  width: 17px;
  height: 17px;
}

.cann-nav-link.is-active .nav-icon,
.cann-nav-link:first-child .nav-icon {
  color: var(--danger);
}

.count-badge {
  min-width: 23px;
  height: 20px;
  padding: 0 7px;
  border-radius: var(--radius-sm);
  background: var(--surface-3);
  color: var(--foreground-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}

.page-shell {
  width: min(1680px, calc(100vw - 96px));
  margin: 0 auto;
  padding: 22px 0 28px;
  display: grid;
  grid-template-columns: 230px minmax(0, 1fr);
  gap: 32px;
}

.side-nav {
  position: sticky;
  top: 84px;
  max-height: calc(100vh - 92px);
  overflow: auto;
  align-self: start;
  padding-top: 18px;
  transition: top var(--duration-base) var(--easing-default);
}

body.is-header-collapsed .side-nav {
  top: 22px;
}

.side-title {
  margin: 0 0 16px;
  padding-left: 18px;
  color: var(--foreground);
  font-size: 18px;
  font-weight: 800;
}

.side-list {
  display: grid;
  gap: var(--space-2);
}

.side-item {
  width: 100%;
  min-height: 46px;
  padding: 0 16px;
  border: 0;
  border-radius: var(--radius-md);
  background: transparent;
  color: var(--foreground-secondary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
  cursor: pointer;
  text-align: left;
}

.side-item:hover {
  background: rgba(255, 255, 255, 0.34);
  color: var(--foreground);
}

.side-item.is-active {
  background: rgba(255, 255, 255, 0.50);
  color: var(--foreground);
}

.side-label {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-width: 0;
  font-size: 14px;
  font-weight: 700;
}

.side-icon {
  width: 18px;
  height: 18px;
  color: var(--foreground-muted);
  flex: 0 0 auto;
}

.side-count {
  color: var(--foreground-muted);
  font-size: 12px;
  font-weight: 700;
}

.side-legend {
  margin: 18px 12px 0;
  padding-top: 16px;
  border-top: 1px solid var(--border-subtle);
  display: grid;
  gap: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--foreground-muted);
  font-size: 12px;
}

.legend-item .status-pill {
  flex: 0 0 auto;
}

.main-column {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.section-head {
  min-height: 42px;
  display: flex;
  align-items: end;
  justify-content: space-between;
  gap: var(--space-4);
}

.section-title {
  margin: 0;
  color: var(--foreground);
  font-size: 20px;
  font-weight: 800;
}

.section-subtitle {
  margin: 5px 0 0;
  color: var(--foreground-muted);
  font-size: 13px;
}

.result-count {
  color: var(--foreground-muted);
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
  align-content: start;
  padding: 2px 0 8px;
}

.launch-card {
  width: 100%;
  min-height: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  cursor: pointer;
  overflow: hidden;
  border: 0;
  transition: box-shadow var(--duration-fast) var(--easing-default);
}

.launch-card:hover {
  box-shadow: 0 16px 34px rgba(15, 23, 42, 0.09);
}

.card-preview {
  margin: 10px 10px 0;
  aspect-ratio: 16 / 9;
  border: 0;
  border-radius: var(--radius-md);
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--surface-2) 70%, white), var(--surface-1));
  overflow: hidden;
  flex: 0 0 auto;
}

.card-preview img,
.card-preview iframe {
  display: block;
  width: 100%;
  height: 100%;
  border: 0;
}

.card-preview img {
  object-fit: cover;
  object-position: top center;
}

.card-preview img.is-contain {
  object-fit: cover;
  padding: 0;
}

.preview-duo {
  width: 100%;
  height: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--surface-2);
}

.preview-duo img {
  min-width: 0;
  object-position: left top;
}

.card-preview iframe {
  pointer-events: none;
  transform: scale(0.82);
  transform-origin: top left;
  width: 122%;
  height: 122%;
  background: var(--surface-1);
}

/* Code Recovery 的预览需要保留左侧源码窗的滚动与标注交互。 */
.card-preview iframe.is-interactive {
  pointer-events: auto;
}

.preview-placeholder {
  height: 100%;
  display: grid;
  place-items: center;
  padding: var(--space-4);
  color: var(--foreground-muted);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
}

.launch-card .card-demo-header {
  padding: 10px 13px 9px;
  flex: 1;
  min-height: 0;
  gap: 4px;
  overflow: hidden;
}

.card-kicker {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  color: var(--foreground-muted);
  font-size: 11px;
  font-weight: 700;
  line-height: 1.2;
}

.card-group-name {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-group-name::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--foreground-muted);
  flex: 0 0 auto;
}

.status-pill {
  height: 19px;
  padding: 0 7px;
  border-radius: var(--radius-pill);
  background: var(--surface-3);
  color: var(--foreground-secondary);
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  flex: 0 0 auto;
}

.status-pill.is-live {
  background: color-mix(in srgb, var(--success) 16%, var(--surface-1));
  color: color-mix(in srgb, var(--success) 60%, var(--foreground));
}

.status-pill.is-proto {
  background: color-mix(in srgb, var(--warning) 18%, var(--surface-1));
  color: color-mix(in srgb, var(--warning) 62%, var(--foreground));
}

.status-pill.is-doc {
  background: var(--surface-3);
  color: var(--foreground-secondary);
}

.launch-card .card-demo-title {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  font-size: 15.5px;
  line-height: 1.2;
}

.launch-card .card-demo-sub {
  margin-top: 1px;
  color: var(--foreground-muted);
  font-size: 11.5px;
  font-weight: 600;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.launch-card .card-demo-description {
  display: -webkit-box;
  overflow: hidden;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  max-height: 46px;
  margin-top: 5px;
  overflow: hidden;
}

.tag-chip {
  height: var(--tag-height);
  padding: 0 var(--tag-padding-x);
  border-radius: var(--tag-radius);
  border: 1px solid var(--comp-tag-border);
  background: var(--comp-tag-bg);
  color: var(--comp-tag-fg);
  display: inline-flex;
  align-items: center;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
}

.launch-card .card-demo-footer {
  margin-top: auto;
  min-height: 34px;
  padding: 5px 12px 10px;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: var(--space-2);
  border-top: 0;
}

.launch-card:not(.has-variants) .card-demo-header {
  padding-bottom: 12px;
}

.launch-card.has-variants .tag-row {
  display: none;
}

.variant-list {
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 6px;
  overflow: visible;
}

.variant-link {
  min-width: 58px;
  max-width: 122px;
  min-height: 28px;
  padding-inline: 11px;
  border-radius: var(--radius-md);
  overflow: hidden;
  text-overflow: ellipsis;
  font-weight: 700;
}

.variant-link:hover,
.variant-link:active {
  transform: none;
}

.launch-card.has-variant-grid .card-demo-footer {
  min-height: 67px;
  align-items: flex-start;
}

.launch-card.has-variant-grid .variant-list {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  overflow: visible;
}

.launch-card.has-variant-grid .variant-link {
  width: 100%;
  max-width: none;
}

.empty-state {
  min-height: 260px;
  border-radius: var(--radius-lg);
  border: 1px dashed var(--border-default);
  background: var(--surface-1);
  color: var(--foreground-muted);
  display: none;
  place-items: center;
  align-content: center;
  text-align: center;
  gap: 6px;
  padding: var(--space-6);
}

.empty-state.is-visible {
  display: grid;
}

.empty-state .empty-title {
  margin: 0;
  color: var(--foreground-secondary);
  font-size: 15px;
  font-weight: 700;
}

.empty-state .empty-hint {
  margin: 0 0 10px;
  font-size: 13px;
}

@media (max-width: 1280px) {
  .cann-primary {
    padding: 0 22px;
    grid-template-columns: minmax(220px, 1fr) minmax(260px, 420px);
  }

  .cann-nav-wrap {
    padding: 0 88px;
  }

  .page-shell {
    width: min(1180px, calc(100vw - 48px));
    grid-template-columns: 210px minmax(0, 1fr);
    gap: 24px;
  }
}

@media (max-width: 1080px) {
  .card-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 920px) {
  .cann-primary {
    height: auto;
    min-height: 118px;
    padding: 14px 18px;
    grid-template-columns: 1fr;
    grid-template-areas:
      "brand"
      "search";
    gap: var(--space-3);
  }

  .cann-brand {
    grid-area: brand;
  }

  .global-search {
    grid-area: search;
  }

  .cann-actions {
    grid-area: actions;
  }

  .cann-nav-wrap {
    height: 52px;
    padding: 0 18px;
    overflow-x: auto;
  }

  .cann-nav {
    gap: 22px;
  }

  .page-shell {
    width: min(100%, calc(100vw - 28px));
    grid-template-columns: 1fr;
  }

  .side-nav {
    position: static;
    padding-top: 0;
    max-height: none;
    overflow: hidden;
  }

  .side-title {
    padding-left: 0;
  }

  .side-list {
    display: flex;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .side-item {
    width: auto;
    flex: 0 0 auto;
  }
}

@media (max-width: 640px) {
  .cann-primary {
    grid-template-columns: 1fr;
    grid-template-areas:
      "brand"
      "search";
  }

  .cann-actions {
    justify-content: flex-start;
    width: 100%;
  }

  .create-btn {
    min-width: 0;
    flex: 1;
  }

  .card-grid {
    grid-template-columns: 1fr;
  }

  .section-head {
    align-items: flex-start;
    flex-direction: column;
  }
}
.launch-card:not([data-href]) { cursor: default; }
.variant-link:disabled { cursor: not-allowed; opacity: 0.5; }
</style>
</head>

    <symbol id="icon-user-round" viewBox="0 0 24 24"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></symbol>

    <symbol id="icon-layers" viewBox="0 0 24 24"><path d="m12 2 9 5-9 5-9-5z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></symbol>
    <symbol id="icon-circle-dot" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="1"/></symbol>
    <symbol id="icon-git-pull-request" viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v6"/><path d="M18 15v-3a6 6 0 0 0-6-6H9"/></symbol>
    <symbol id="icon-columns-3" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/></symbol>
    <symbol id="icon-users-round" viewBox="0 0 24 24"><path d="M18 21a6 6 0 0 0-12 0"/><circle cx="12" cy="11" r="4"/><path d="M22 21a5 5 0 0 0-3-4.6"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/><path d="M2 21a5 5 0 0 1 3-4.6"/><path d="M8 3.1a4 4 0 0 0 0 7.8"/></symbol>
    <symbol id="icon-toolbox" viewBox="0 0 24 24"><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M4 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/><path d="M2 13h20"/><path d="M12 13v3"/></symbol>
    <symbol id="icon-layout-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-cpu" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/><rect x="10" y="10" width="4" height="4"/><path d="M4 10H2"/><path d="M4 14H2"/><path d="M22 10h-2"/><path d="M22 14h-2"/><path d="M10 4V2"/><path d="M14 4V2"/><path d="M10 22v-2"/><path d="M14 22v-2"/></symbol>
    <symbol id="icon-network" viewBox="0 0 24 24"><rect x="16" y="16" width="6" height="6" rx="1"/><rect x="2" y="16" width="6" height="6" rx="1"/><rect x="9" y="2" width="6" height="6" rx="1"/><path d="M5 16v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/><path d="M12 8v3"/></symbol>
    <symbol id="icon-activity" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
    <symbol id="icon-code-2" viewBox="0 0 24 24"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></symbol>
    <symbol id="icon-book-open" viewBox="0 0 24 24"><path d="M12 7v14"/><path d="M3 18a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2h5a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3z"/><path d="M21 18a1 1 0 0 0 1-1V5a2 2 0 0 0-2-2h-5a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3z"/></symbol>
  </defs>
</svg>
<div class="cann-app">
  <header class="cann-topbar">
    <div class="cann-primary">
      <div class="cann-brand">
        <a class="cann-logo" href="catalog.html" aria-label="返回陈列馆" hidden>
          <img src="assets/logo-cann.svg" alt="CANN">
        </a>
        <strong class="cann-name">AI 开发工具链</strong>
      </div>

      <label class="global-search" aria-label="全局搜索">
        <svg class="svg-icon search-icon" aria-hidden="true"><use href="#icon-search"></use></svg>
        <input id="globalSearch" type="search" placeholder="按下 / 快速开启搜索" autocomplete="off">
      </label>

    </div>
  </header>

  <main class="page-shell">
    <aside class="side-nav" aria-label="陈列馆分类">
      <h2 class="side-title">分类</h2>
      <div class="side-list" id="categoryList"></div>
      <div class="side-legend">
        <span class="legend-item"><span class="status-pill is-live">可体验</span>可真实交互</span>
        <span class="legend-item"><span class="status-pill is-proto">原型</span>草图 / 占位</span>
        <span class="legend-item"><span class="status-pill is-doc">文档</span>白皮书 / 说明</span>
      </div>
    </aside>

    <section class="main-column">
      <div class="section-head">
        <div>
          <h2 class="section-title" id="activeTitle">全部项目</h2>
        </div>
        <div class="result-count" id="resultCount"></div>
      </div>

      <div class="card-grid" id="grid" aria-live="polite"></div>
      <div class="empty-state" id="emptyState">
        <p class="empty-title">没有匹配的工具</p>
        <p class="empty-hint">换个关键词,或清空当前筛选试试。</p>
        <button class="btn btn-sm" type="button" id="resetFilters">清空筛选</button>
      </div>
    </section>
  </main>
</div>

<script>
const categories = [
  { id: "all", label: "全部", icon: "icon-layout-grid" },
  { id: "Agent与协作", label: "Agent与协作", icon: "icon-users-round" },
  { id: "决策与诊断", label: "决策与诊断", icon: "icon-activity" },
  { id: "采集与执行", label: "采集与执行", icon: "icon-toolbox" },
  { id: "底层与运行生态", label: "底层与运行生态", icon: "icon-cpu" }
];

const launchItems = [
  {
    "title": "性能分析2.0",
    "group": "Agent与协作",
    "status": "hi-fi",
    "desc": "模型训/推性能分析，Agent辅助性能调优",
    "href": "https://lovebearanddonkey.github.io/InsightChat/app/pages/chat.html",
    "preview": "",
    "blankPreview": true,
    "tags": [],
    "variants": [
      {
        "label": "性能分析2.0",
        "href": "https://lovebearanddonkey.github.io/InsightChat/app/pages/chat.html"
      }
    ]
  },
  {
    "title": "采集指令沙箱",
    "group": "采集与执行",
    "status": "hi-fi",
    "desc": "表单式、命令式采集指令编排与效果预估",
    "href": "https://lovebearanddonkey.github.io/AI-Development-Toolchain/msProf/性能采集实验台.html",
    "preview": "",
    "blankPreview": true,
    "tags": [],
    "variants": [
      {
        "label": "沙箱",
        "href": "https://lovebearanddonkey.github.io/AI-Development-Toolchain/msProf/性能采集实验台.html"
      }
    ]
  },
  {
    "title": "训练配置校验",
    "group": "底层与运行生态",
    "status": "hi-fi",
    "desc": "模型结构与并行配置可视化，训练配置兼容性校验，配置寻优",
    "href": "https://lovebearanddonkey.github.io/InsightChat/demo/",
    "preview": "",
    "blankPreview": true,
    "tags": [],
    "variants": [
      {
        "label": "训练配置校验",
        "href": "https://lovebearanddonkey.github.io/InsightChat/demo/"
      }
    ]
  },
  {
    "title": "重计算与Swap提升性能",
    "group": "底层与运行生态",
    "status": "doc",
    "desc": "重计算与Swap的细粒度控制对内存和性能影响",
    "href": "",
    "preview": "",
    "blankPreview": true,
    "tags": [],
    "variants": [
      {
        "label": "场景教学",
        "href": ""
      }
    ]
  }
];

const visibleLaunchItems = launchItems.filter((item) => !item.hidden);

const STATUS_META = {
  "hi-fi": { label: "可体验", cls: "is-live" },
  "lo-fi": { label: "原型", cls: "is-proto" },
  "doc": { label: "文档", cls: "is-doc" }
};

const state = {
  category: "all",
  query: "",
  status: "all",
  sort: "default"
};

const categoryList = document.getElementById("categoryList");
const grid = document.getElementById("grid");
const emptyState = document.getElementById("emptyState");
const resultCount = document.getElementById("resultCount");
const activeTitle = document.getElementById("activeTitle");
const topbar = document.querySelector(".cann-topbar");
const globalSearch = document.getElementById("globalSearch");

function itemTargetAttrs(href) {
  const isExternal = /^https?:\/\//.test(href);
  return isExternal ? ' target="_blank" rel="noreferrer"' : "";
}

function normalize(value) {
  return String(value || "").trim().toLowerCase();
}

function renderCategories() {
  const counts = visibleLaunchItems.reduce((acc, item) => {
    acc[item.group] = (acc[item.group] || 0) + 1;
    return acc;
  }, {});

  categoryList.innerHTML = categories.map((category) => {
    const count = category.id === "all" ? visibleLaunchItems.length : (counts[category.id] || 0);
    const active = state.category === category.id ? " is-active" : "";
    return `
      <button class="side-item${active}" type="button" data-category="${category.id}">
        <span class="side-label"><svg class="svg-icon side-icon" aria-hidden="true"><use href="#${category.icon}"></use></svg>${category.label}</span>
        <span class="side-count">${count}</span>
      </button>
    `;
  }).join("");
}

function getFilteredItems() {
  const query = normalize(state.query);
  let items = visibleLaunchItems.filter((item) => {
    const inCategory = state.category === "all" || item.group === state.category;
    const inStatus = state.status === "all" || item.status === state.status;
    const haystack = normalize([
      item.title,
      item.sub,
      item.group,
      item.status,
      (STATUS_META[item.status] || {}).label,
      item.desc,
      item.href,
      ...(item.tags || []),
      ...(item.variants || []).map((variant) => `${variant.label} ${variant.href}`)
    ].join(" "));
    return inCategory && inStatus && (!query || haystack.includes(query));
  });

  if (state.sort === "title") {
    items = [...items].sort((a, b) => a.title.localeCompare(b.title, "zh-CN"));
  } else if (state.sort === "group") {
    items = [...items].sort((a, b) => {
      const groupResult = a.group.localeCompare(b.group, "zh-CN");
      return groupResult || a.title.localeCompare(b.title, "zh-CN");
    });
  }

  return items;
}

function renderPreview(item) {
  if (item.blankPreview) return "";
  if (item.previewFrame) {
    const interactiveClass = item.interactivePreview ? " class=\"is-interactive\"" : "";
    return `<iframe${interactiveClass} src="${item.previewFrame}" title="${item.title} 预览" loading="lazy"></iframe>`;
  }

  if (item.preview) {
    const fitClass = item.fit === "contain" ? " class=\"is-contain\"" : "";
    if (item.previewDark) {
      return `
        <div class="preview-duo">
          <img${fitClass} src="${item.preview}" alt="${item.title} 浅色静态预览" loading="lazy" decoding="async">
          <img${fitClass} src="${item.previewDark}" alt="${item.title} 深色静态预览" loading="lazy" decoding="async">
        </div>
      `;
    }
    return `<img${fitClass} src="${item.preview}" alt="${item.title} 静态预览" loading="lazy" decoding="async">`;
  }

  return `<div class="preview-placeholder">${item.group}</div>`;
}

function renderCard(item) {
  const hasLink = Boolean(item.href);
  const linkAttrs = hasLink ? ` href="${item.href}"${itemTargetAttrs(item.href)}` : "";
  const cardAttrs = hasLink ? ` data-href="${item.href}" role="link" tabindex="0"` : "";
  const previewTag = hasLink ? "a" : "div";
  const titleTag = hasLink ? "a" : "div";
  const variants = item.variants || [];
  const hasVariants = variants.length > 0;
  const variantLayoutClass = item.variantLayout === "grid" ? " has-variant-grid" : "";
  const footerHtml = hasVariants ? variants.map((variant) => {
    if (!variant.href) return `<button class="btn btn-sm variant-link" type="button" disabled>${variant.label}</button>`;
    const target = variant.newTab ? ' target="_blank" rel="noreferrer"' : itemTargetAttrs(variant.href);
    return `
    <a class="btn btn-sm variant-link" href="${variant.href}"${target}>${variant.label}</a>
  `;
  }).join("") : "";

  const tagHtml = (item.tags || []).slice(0, 3).map((tag) => `<span class="tag-chip">${tag}</span>`).join("");
  const status = STATUS_META[item.status] || { label: item.status, cls: "" };

  return `
    <article class="card-demo launch-card${hasVariants ? " has-variants" : ""}${variantLayoutClass}" data-group="${item.group}" data-status="${item.status}" ${cardAttrs}>
      <${previewTag} class="card-preview"${linkAttrs}${hasLink ? ` aria-label="打开 ${item.title}"` : ' aria-hidden="true"'}>
        ${renderPreview(item)}
      </${previewTag}>
      <div class="card-demo-header">
        <div class="card-kicker">
          <span class="card-group-name">${item.group}</span>
          <span class="status-pill${status.cls ? " " + status.cls : ""}">${status.label}</span>
        </div>
        <${titleTag} class="card-demo-title"${linkAttrs}>${item.title}</${titleTag}>
        ${item.sub ? `<div class="card-demo-sub">${item.sub}</div>` : ""}
        <div class="card-demo-description">${item.desc}</div>
        <div class="tag-row">${tagHtml}</div>
      </div>
      ${hasVariants ? `<div class="card-demo-footer">
        <div class="variant-list">${footerHtml}</div>
      </div>` : ""}
    </article>
  `;
}

function renderGrid() {
  const items = getFilteredItems();
  const activeCategory = categories.find((category) => category.id === state.category);
  activeTitle.textContent = state.category === "all" ? "全部项目" : activeCategory.label;
  resultCount.textContent = `${items.length}/${visibleLaunchItems.length}`;
  grid.innerHTML = items.map(renderCard).join("");
  emptyState.classList.toggle("is-visible", items.length === 0);
}

function syncSearch(value) {
  state.query = value;
  if (globalSearch.value !== value) globalSearch.value = value;
  renderGrid();
}

categoryList.addEventListener("click", (event) => {
  const button = event.target.closest("[data-category]");
  if (!button) return;
  state.category = button.dataset.category;
  renderCategories();
  renderGrid();
});

globalSearch.addEventListener("input", (event) => syncSearch(event.target.value));

const resetFilters = document.getElementById("resetFilters");
resetFilters.addEventListener("click", () => {
  state.category = "all";
  state.query = "";
  globalSearch.value = "";
  renderCategories();
  renderGrid();
});

grid.addEventListener("click", (event) => {
  if (event.target.closest("a, button, input, select")) return;
  const card = event.target.closest(".launch-card[data-href]");
  if (!card) return;
  const href = card.dataset.href;
  if (/^https?:\/\//.test(href)) {
    window.open(href, "_blank", "noreferrer");
  } else {
    window.location.href = href;
  }
});

grid.addEventListener("keydown", (event) => {
  if (event.key !== "Enter" && event.key !== " ") return;
  const card = event.target.closest(".launch-card[data-href]");
  if (!card) return;
  event.preventDefault();
  card.click();
});

window.addEventListener("keydown", (event) => {
  const isTyping = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (event.key === "/" && !isTyping) {
    event.preventDefault();
    globalSearch.focus();
  }
});

let lastScrollY = window.scrollY;
let scrollTicking = false;

function setHeaderCollapsed(collapsed) {
  topbar.classList.toggle("is-collapsed", collapsed);
  document.body.classList.toggle("is-header-collapsed", collapsed);
}

function updateHeaderOnScroll() {
  const currentY = window.scrollY;
  const delta = currentY - lastScrollY;

  if (currentY <= 8) {
    setHeaderCollapsed(false);
  } else if (delta > 8) {
    setHeaderCollapsed(true);
  } else if (delta < -8) {
    setHeaderCollapsed(false);
  }

  lastScrollY = currentY;
  scrollTicking = false;
}

window.addEventListener("scroll", () => {
  if (scrollTicking) return;
  scrollTicking = true;
  window.requestAnimationFrame(updateHeaderOnScroll);
}, { passive: true });

renderCategories();
renderGrid();
</script>
</body>
</html>
