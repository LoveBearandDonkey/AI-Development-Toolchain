<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>计算主题装饰图形 · 圆角长方体</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
      background: #f7f7f8;
      color: #20242c;
      accent-color: #4f55a1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 1264px; margin: auto; padding: 56px 32px 40px; }
    header { margin-bottom: 28px; }
    h1 { margin: 0; font-size: clamp(26px, 4vw, 40px); letter-spacing: -.04em; }
    p { margin: 12px 0 0; color: #515763; line-height: 1.6; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 296px; gap: 16px; }
    figure { display: grid; grid-template-rows: 1fr auto; align-self: start; position: sticky; top: 16px; margin: 0; overflow: hidden; }
    figure, aside { border: 1px solid #e2e3e7; border-radius: 16px; }
    .stage { display: grid; place-items: center; padding: 12px; background: #ececec; }
    canvas { display: block; width: 100%; height: auto; }
    figcaption { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; }
    figcaption, aside { background: #fff; }
    figcaption span { color: #515763; font-size: 13px; }
    aside { padding: 18px; }
    fieldset { margin: 0 0 20px; padding: 0; border: 0; min-width: 0; }
    fieldset:last-of-type { margin-bottom: 0; }
    legend { padding: 0; margin-bottom: 10px; font-weight: 650; }
    .presets { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button { cursor: pointer; border: 1px solid #dfe1e7; border-radius: 8px; background: #fff; color: inherit; padding: 7px 10px; font: inherit; font-size: 13px; }
    button:hover { background: #f3f3f7; }
    button[aria-pressed="true"] { background: #f0eff9; border-color: #827fba; }
    button:disabled { cursor: wait; opacity: .65; }
    .preset { text-align: left; display: flex; gap: 7px; align-items: center; }
    .preset::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--swatch); flex: none; }
    .preset-dynamic { grid-column: 1 / -1; }
    .mix-preset { grid-column: 1 / -1; display: flex; gap: 6px; }
    .mix-preset .preset { flex: 1; }
    .reroll-mix { padding: 0 8px; min-width: 32px; font-size: 17px; }
    .mix-options { margin-top: 6px; }
    .mix-colors { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 2px; touch-action: pan-y; user-select: none; }
    .mix-swatch { position: relative; display: grid; place-items: center; min-width: 0; height: 32px; padding: 0; border: 0; border-radius: 50%; cursor: grab; }
    .mix-swatch, .mix-swatch:hover, .mix-swatch[aria-pressed="true"] { background: transparent; }
    .mix-swatch::before { content: ""; width: 16px; height: 16px; border-radius: 50%; background: var(--swatch); }
    .mix-swatch[aria-pressed="true"]::before { outline: 2px solid #4f55a1; outline-offset: 2px; }
    .mix-swatch:focus-visible { outline: 1px dashed #4f55a1; outline-offset: -1px; }
    .mix-swatch[data-dragging] { z-index: 1; transform: translateX(var(--drag-offset, 0px)); cursor: grabbing; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .pose-control { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .pose-switch { display: flex; gap: 2px; padding: 2px; border-radius: 8px; background: #f0eff3; }
    .pose-switch input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .pose-switch span { display: block; min-width: 44px; padding: 4px 10px; border: 1px solid transparent; border-radius: 6px; text-align: center; cursor: pointer; }
    .pose-switch input:checked + span { border-color: #827fba; background: #fff; }
    .pose-switch input:focus-visible + span { outline: 2px solid #4f55a1; outline-offset: 1px; }
    .control { display: grid; grid-template-columns: 1fr auto; align-items: center; min-height: 40px; font-size: 13px; }
    output { color: #535969; font: 12px ui-monospace, monospace; }
    input[type="range"] { grid-column: 1 / -1; width: 100%; height: 14px; margin: 2px 0 5px; cursor: pointer; }
    .reset { margin-top: 14px; }
    @media (max-width: 760px) {
      main { padding: 28px 16px; }
      .workspace { grid-template-columns: 1fr; }
      figure { position: static; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>计算主题装饰图形</h1>
      <p>从性能泳道的块状节奏，提炼装饰图形的基本单元。</p>
    </header>
    <div class="workspace">
      <figure>
        <div class="stage"><canvas id="preview" width="720" height="450" aria-label="圆角长方体预览">浏览器需要支持 Canvas 才能显示图形。</canvas></div>
        <figcaption>
          <span id="render-status" role="status">PNG · 1440 × 900 · 透明底</span>
          <button id="download" type="button">下载 PNG</button>
        </figcaption>
      </figure>
      <aside aria-label="绘制参数">
        <fieldset>
          <legend>配色</legend>
          <div class="presets" id="presets">
            <button class="preset" data-palette="violet" style="--swatch: #aeb0fa" aria-pressed="true" type="button">雾紫</button>
            <button class="preset" data-palette="cyan" style="--swatch: #79dbda" aria-pressed="false" type="button">青绿</button>
            <button class="preset" data-palette="lime" style="--swatch: #bce891" aria-pressed="false" type="button">嫩绿蜜桃</button>
            <button class="preset" data-palette="amber" style="--swatch: #fab95f" aria-pressed="false" type="button">暖橙</button>
            <button class="preset" data-palette="ice" style="--swatch: #6ca9ee" aria-pressed="false" type="button">冷蓝</button>
            <button class="preset" data-palette="mint" style="--swatch: #78d48d" aria-pressed="false" type="button">薄荷</button>
            <button class="preset" data-palette="rose" style="--swatch: #ee92b0" aria-pressed="false" type="button">雾粉</button>
            <button class="preset" data-palette="copper" style="--swatch: #bf9173" aria-pressed="false" type="button">暖铜</button>
            <div class="mix-preset">
              <button class="preset" data-palette="mixed" style="--swatch: linear-gradient(120deg, #6ca9ee, #78d48d, #ee92b0)" aria-controls="mix-options" aria-pressed="false" type="button">随机混色与自定义</button>
              <button class="reroll-mix" id="reroll-mix" type="button" aria-label="重新随机" title="重新随机" hidden>⟳</button>
            </div>
            <button class="preset preset-dynamic" data-palette="dynamic" style="--swatch: conic-gradient(#ee92b0, #fab95f, #78d48d, #6ca9ee, #ee92b0)" aria-pressed="false" type="button">动态</button>
          </div>
          <div class="mix-options" id="mix-options" hidden>
            <span class="visually-hidden" id="mix-hint">颜色从近端到远端排列。</span>
            <div class="mix-colors" id="mix-colors" role="group" aria-label="混色颜色" aria-describedby="mix-hint"></div>
          </div>
        </fieldset>
        <fieldset>
          <legend>形体与材质</legend>
          <div class="pose-control" role="group" aria-labelledby="pose-label">
            <span id="pose-label">姿态</span>
            <div class="pose-switch">
              <label><input name="pose" type="radio" value="long" checked><span>长</span></label>
              <label><input name="pose" type="radio" value="high"><span>高</span></label>
            </div>
          </div>
          <div class="control"><label for="length">长度</label><output for="length"></output><input id="length" type="range" min="1" max="5" step="0.1" value="4.6" data-precision="1"></div>
          <div class="control"><label for="width">宽度</label><output for="width"></output><input id="width" type="range" min="1" max="5" step="0.01" value="1.66" data-precision="2"></div>
          <div class="control"><label for="height">厚度</label><output for="height"></output><input id="height" type="range" min="1" max="2" step="0.02" value="1" data-precision="2"></div>
          <div class="control"><label for="rounding">圆角</label><output for="rounding"></output><input id="rounding" type="range" min="0.16" max="0.95" step="0.01" value="0.72" data-unit="%"></div>
          <div class="control"><label for="yaw">水平转角</label><output for="yaw"></output><input id="yaw" type="range" min="-60" max="60" step="1" value="44" data-unit="°"></div>
          <div class="control"><label for="pitch">俯仰转角</label><output for="pitch"></output><input id="pitch" type="range" min="-60" max="60" step="1" value="32" data-unit="°"></div>
          <div class="control"><label for="softness">色域扩散</label><output for="softness"></output><input id="softness" type="range" min="0" max="1" step="0.01" value="0.57" data-unit="%"></div>
          <div class="control"><label for="rim">轮廓着色强度</label><output for="rim"></output><input id="rim" type="range" min="0" max="1" step="0.01" value="0.48" data-unit="%"></div>
          <div class="control"><label for="rimDepth">轮廓着色厚度</label><output for="rimDepth"></output><input id="rimDepth" type="range" min="0" max="64" step="1" value="32" data-unit=" px"></div>
        </fieldset>
        <button class="reset" id="reset" type="button">恢复默认</button>
      </aside>
    </div>
  </main>
  <script src="../../assets/rounded-block-renderer.js?v=20261128-hidpi"></script>
  <script src="rounded-block.js?v=20261128-timeline"></script>
</body>
</html>
